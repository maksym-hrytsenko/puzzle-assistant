name: PuzzleAssistant
options:
  bundleIdPrefix: com.mgricenko.puzzleassistant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PuzzleAssistant:
    type: application
    platform: iOS
    sources:
      - path: PuzzleAssistant
    info:
      path: PuzzleAssistant/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Puzzle Assistant uses the camera to photograph your puzzle's reference image and loose pieces so it can suggest where they belong."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgricenko.puzzleassistant
        PRODUCT_NAME: PuzzleAssistant
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PuzzleAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PuzzleAssistantTests
    dependencies:
      - target: PuzzleAssistant
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PuzzleAssistant:
    build:
      targets:
        PuzzleAssistant: all
        PuzzleAssistantTests: [test]
    test:
      targets:
        - PuzzleAssistantTests
    run:
      config: Debug
