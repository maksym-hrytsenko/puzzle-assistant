name: PuzzleAssistant
options:
  bundleIdPrefix: com.mgricenko.puzzleassistant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PuzzleAssistant:
    type: application
    platform: iOS
    sources:
      - path: PuzzleAssistant
    info:
      path: PuzzleAssistant/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Камера потрібна, щоб фотографувати картинку пазла та розкидані шматки."
        NSPhotoLibraryUsageDescription: "Доступ до фото потрібен, щоб завантажити картинку пазла або фото шматків."
        CFBundleDisplayName: "Пазл-помічник"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgricenko.puzzleassistant
        PRODUCT_NAME: PuzzleAssistant
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Pixel loops (masks, templates) are far too slow without optimization.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  PuzzleAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PuzzleAssistantTests
    dependencies:
      - target: PuzzleAssistant
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PuzzleAssistant:
    build:
      targets:
        PuzzleAssistant: all
        PuzzleAssistantTests: [test]
    test:
      targets:
        - PuzzleAssistantTests
    run:
      config: Debug
